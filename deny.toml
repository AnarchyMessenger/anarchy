# Dependency policy, enforced in CI with `cargo deny check`.
# Clean-room rule: only permissive licenses may enter the dependency tree (ARCHITECTURE principle 1).

[graph]
all-features = true

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  "0BSD",
  # File-level copyleft, compatible with AGPL (MPL-2.0 §3.3). Needed by OpenMLS (hpke-rs) and
  # Tauri (cssparser, selectors). Obligation: publish changes we make to those crates' files.
  "MPL-2.0",
]
confidence-threshold = 0.9

# Our own crates are AGPL-3.0-only.
[[licenses.exceptions]]
allow = ["AGPL-3.0-only"]
crate = "anarchy-proto"
[[licenses.exceptions]]
allow = ["AGPL-3.0-only"]
crate = "anarchy-core"
[[licenses.exceptions]]
allow = ["AGPL-3.0-only"]
crate = "anarchy-server"
[[licenses.exceptions]]
allow = ["AGPL-3.0-only"]
crate = "anarchy-desktop"
[[licenses.exceptions]]
allow = ["AGPL-3.0-only"]
crate = "anarchy-testkit"
[[licenses.exceptions]]
allow = ["AGPL-3.0-only"]
crate = "anarchy-brain"

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
yanked = "deny"
# Vulnerabilities always fail. "Unmaintained" notices fail only for crates we depend on
# directly; transitive ones (today: proc-macro-error*, unic-* via Tauri's build tooling) are tracked upstream.
unmaintained = "workspace"
ignore = [
  # Marvin attack on `rsa` (timing side channel when decrypting or signing with a
  # private RSA key). jsonwebtoken uses `rsa` only to *verify* RS256 ID tokens with
  # the identity provider's public key; the server never holds an RSA private key.
  # The alternative backend (aws-lc-rs) brings OpenSSL-licensed code, which is
  # incompatible with AGPL. Revisit when a fixed `rsa` release ships.
  { id = "RUSTSEC-2023-0071", reason = "public-key signature verification only; no private RSA key is ever used" },
]
