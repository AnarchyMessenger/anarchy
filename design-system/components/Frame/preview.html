<!-- @dsCard group="Chrome" height=390 -->
<style>body{margin:0;padding:16px;background:var(--canvas);font-family:var(--font-sans,system-ui)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.f{position:relative;height:74px;border-radius:12px;padding:8px 8px 8px 30px;background:linear-gradient(135deg,var(--a),var(--b) 55%,var(--c))}
.f .p{height:100%;border-radius:8px;background:var(--surface);box-shadow:0 0 0 1px rgba(0,0,0,.08),0 6px 18px rgba(17,21,28,.10)}
.f i{position:absolute;left:9px;top:10px;width:14px;height:14px;border-radius:4px;background:var(--ink)}
.f span{position:absolute;right:14px;bottom:12px;font-size:12px;font-weight:500;color:var(--ink-muted)}
</style>
<div class="grid">
<div class="f" style="--a:var(--frame-ember-a);--b:var(--frame-ember-b);--c:var(--frame-ember-c)"><i></i><div class="p"></div><span>Ember</span></div>
<div class="f" style="--a:var(--frame-cobalt-a);--b:var(--frame-cobalt-b);--c:var(--frame-cobalt-c)"><i></i><div class="p"></div><span>Cobalt</span></div>
<div class="f" style="--a:var(--frame-spring-a);--b:var(--frame-spring-b);--c:var(--frame-spring-c)"><i></i><div class="p"></div><span>Spring</span></div>
<div class="f" style="--a:var(--frame-summer-a);--b:var(--frame-summer-b);--c:var(--frame-summer-c)"><i></i><div class="p"></div><span>Summer</span></div>
<div class="f" style="--a:var(--frame-autumn-a);--b:var(--frame-autumn-b);--c:var(--frame-autumn-c)"><i></i><div class="p"></div><span>Autumn</span></div>
<div class="f" style="--a:var(--frame-winter-a);--b:var(--frame-winter-b);--c:var(--frame-winter-c)"><i></i><div class="p"></div><span>Winter</span></div>
<div class="f" style="--a:var(--frame-coral-a);--b:var(--frame-coral-b);--c:var(--frame-coral-c)"><i></i><div class="p"></div><span>Coral</span></div>
<div class="f" style="--a:var(--frame-ocean-a);--b:var(--frame-ocean-b);--c:var(--frame-ocean-c)"><i></i><div class="p"></div><span>Ocean</span></div>
<div class="f" style="--a:var(--frame-forest-a);--b:var(--frame-forest-b);--c:var(--frame-forest-c)"><i></i><div class="p"></div><span>Forest</span></div>
<div class="f" style="--a:var(--frame-dusk-a);--b:var(--frame-dusk-b);--c:var(--frame-dusk-c)"><i></i><div class="p"></div><span>Dusk</span></div>
</div>
<script>/* static */</script>
