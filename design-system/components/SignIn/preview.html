<!-- @dsCard group="Onboarding" height=440 -->
<style>body{margin:0;padding:16px;background:var(--canvas);font-family:var(--font-sans,system-ui)}
.win{display:grid;grid-template-columns:47% 1fr;height:400px;border-radius:14px;padding:8px;background:linear-gradient(135deg,var(--frame-ocean-a),var(--frame-ocean-b) 55%,var(--frame-ocean-c))}
.pane{display:grid;place-items:center;border-radius:10px;background:var(--surface);box-shadow:0 0 0 1px rgba(0,0,0,.08),0 10px 30px rgba(17,21,28,.12)}
.form{display:grid;gap:10px;width:260px;text-align:center}
.mark{justify-self:center;display:grid;place-items:center;width:32px;height:32px;border-radius:8px;background:var(--primary);font-weight:800;color:var(--on-primary)}
h1{margin:0;font-size:20px;color:var(--ink)} p{margin:0;font-size:13px;color:var(--ink-muted)}
.b{height:36px;border-radius:8px;font:inherit;font-size:13px;font-weight:500;cursor:pointer}
.ink{border:1px solid var(--ink);background:var(--ink);color:var(--surface)} .out{border:1px solid var(--border-strong);background:var(--surface);color:var(--ink)}
input{height:36px;padding:0 12px;border:1px solid var(--border-strong);border-radius:8px;font:inherit;font-size:13px;background:var(--surface);color:var(--ink)}
.or{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-faint)} .or::before,.or::after{content:"";flex:1;border-top:1px solid var(--border)}
.art{display:grid;place-items:center}
.card{display:grid;gap:4px;width:250px;padding:14px 16px;border-radius:14px;color:#1a1814;transform:rotate(-4deg);background:linear-gradient(135deg,var(--frame-ocean-a),var(--frame-ocean-b) 55%,var(--frame-ocean-c));box-shadow:0 0 0 1px rgba(26,24,20,.1),0 24px 44px -16px rgba(26,24,20,.35)}
.card .top{display:flex;justify-content:space-between;font-family:var(--font-mono,monospace);font-size:9px;letter-spacing:.14em;opacity:.7}.card .av{display:grid;place-items:center;width:40px;height:40px;margin:10px 0;border-radius:10px;background:rgba(255,255,255,.55);font-size:20px}.card .nm{font-size:18px;font-weight:700;letter-spacing:-.02em}.card .hd{font-family:var(--font-mono,monospace);font-size:12px}.card .hd span{opacity:.55}
</style>
<div class="win"><div class="pane"><div class="form">
<div class="mark">A</div><h1>Create your account</h1><p>anarchy.chat · <u>Change</u></p>
<button class="b out">Continue with Google</button><div class="or">or</div>
<input aria-label="Work email" placeholder="you@example.com"><button class="b ink">Continue with email</button>
<p>or <u>continue anonymously</u></p></div></div>
<div class="art"><div class="card"><div class="top"><span>ANARCHY</span><span>FREELANCE</span></div><div class="av">🌊</div><div class="nm">Maya Chen</div><div class="hd">@maya<span>#0427</span></div></div></div></div>
<script>/* static */</script>
