name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Core, server and Brain (fmt, clippy, test)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ANARCHY_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # A throwaway Dovecot for the mail tests (crates/anarchy-mail/tests).
      - run: sudo apt-get update -q && sudo apt-get install -y -q dovecot-imapd && scripts/test-mail-server.sh
      - run: cargo test
        env:
          ANARCHY_TEST_IMAP: 127.0.0.1:1143

  desktop:
    name: Desktop app (Tauri 2)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ANARCHY_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install WebKitGTK and Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p anarchy-desktop --all-targets -- -D warnings
      - run: cargo test -p anarchy-desktop

  dependencies:
    name: Licenses and advisories (cargo-deny)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  design-system:
    name: Design tokens are up to date
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node design-system/build.mjs
      - name: Fail if generated CSS differs from what is committed
        run: git diff --exit-code -- design-system/dist apps/desktop/ui/ds
      - name: Buddy package tests
        run: node packages/buddy/test.mjs
      - run: node packages/buddy/build.mjs
      - name: Fail if the app's copy of Buddy differs from the package
        run: git diff --exit-code -- apps/desktop/ui/buddy
