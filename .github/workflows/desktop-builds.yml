name: Desktop builds

# Builds the installers on Windows (NSIS .exe and MSI) and macOS (a universal
# .dmg for Apple silicon and Intel) and keeps them as downloads on the run.
# Runs when the app changes on main, or by hand from the Actions tab.
# The builds aren't signed yet: Windows SmartScreen and macOS Gatekeeper warn.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/desktop-builds.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows installer (NSIS + MSI)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-bundle
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build the installers
        working-directory: apps/desktop/src-tauri
        run: cargo tauri build --bundles nsis,msi
      - uses: actions/upload-artifact@v4
        with:
          name: anarchy-windows-${{ github.sha }}
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi

  macos:
    name: macOS app (universal .dmg)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-bundle
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build the app
        working-directory: apps/desktop/src-tauri
        run: cargo tauri build --target universal-apple-darwin --bundles app,dmg
      - uses: actions/upload-artifact@v4
        with:
          name: anarchy-macos-${{ github.sha }}
          if-no-files-found: error
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
