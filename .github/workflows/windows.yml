name: Windows build

# Builds the Windows installers (NSIS .exe and MSI) on a Windows runner and
# keeps them as a download on the run. Runs when the app changes on main, or
# by hand from the Actions tab.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/windows.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows installer (NSIS + MSI)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-bundle
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build the installers
        working-directory: apps/desktop/src-tauri
        run: cargo tauri build --bundles nsis,msi
      - uses: actions/upload-artifact@v4
        with:
          name: anarchy-windows-${{ github.sha }}
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/anarchy-desktop.exe
