[package]
name = "anarchy-desktop"
description = "Anarchy desktop app (Tauri 2)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anarchy-core.workspace = true
anarchy-proto.workspace = true
anarchy-mail.workspace = true
serde_json.workspace = true
tokio.workspace = true
# Opens the sign-in page in the default browser.
open = "5"
# Desktop notifications for new messages (respects the user's settings).
tauri-plugin-notification = "2"
# Native open/save pickers for the drive (used from Rust only).
tauri-plugin-dialog = "2"
# Serves the drives to the OS file manager over WebDAV on 127.0.0.1 (Apache-2.0).
dav-server = { version = "0.11", default-features = false, features = ["hyper"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
bytes = "1"
futures-util = "0.3"
uuid.workspace = true
base64.workspace = true
tauri = { version = "2", features = [] }
serde.workspace = true
getrandom.workspace = true
# OS keychain for the device database key: macOS Keychain, Windows Credential Manager,
# Secret Service (GNOME Keyring, KWallet) on Linux.
# Passphrase lock for the device key (both MIT/Apache-2.0).
argon2 = "0.5"
chacha20poly1305 = "0.10"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
qrcode = { version = "0.14", default-features = false }

[dev-dependencies]
anarchy-testkit.workspace = true
